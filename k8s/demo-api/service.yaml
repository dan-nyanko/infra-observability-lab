apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: observability
  annotations:
    cloud.google.com/backend-config: '{"default": "demo-api-backendconfig"}'
spec:
  selector:
    app: demo-api
    version: ${DEMO_API_SELECTOR}
  ports:
  - port: 80
    targetPort: 5000
  type: NodePort