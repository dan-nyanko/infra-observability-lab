apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: observability
data:
  dashboard-providers.yaml: |
    apiVersion: 1
    providers:
      - name: 'demo-api'
        orgId: 1
        folder: 'Demo-API'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
