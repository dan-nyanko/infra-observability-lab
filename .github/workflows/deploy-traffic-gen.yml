name: Deploy Traffic Gen

on:
  push:
    branches: ["main"]
    paths:
      - "traffic_gen/**"
      - "terraform/traffic-gen/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        working-directory: demo_api
        run: |
          IMAGE=dannyanko/infra-traffic-gen
          TAG=${{ github.sha }}
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t $IMAGE:$TAG -t $IMAGE:latest \
            --push .

  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_LOG: INFO

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          audience: https://github.com/

      - name: Write tfvars
        run: |
          cat > terraform.tfvars <<'EOF'
          ${{ secrets.TFVARS }}
          EOF
        working-directory: terraform

      - name: Terraform Init
        run: |
          terraform init
        working-directory: terraform

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -var-file=terraform.tfvars
