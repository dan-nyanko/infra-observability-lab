name: Demo API Drills

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose drill mode: incident or rollback"
        required: true
        default: "incident"
        type: choice
        options:
          - incident
          - rollback

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_LOG: INFO

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          audience: https://github.com/

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: observability-lab
          location: us-central1

      - name: Write tfvars
        working-directory: terraform
        run: |
          cat > terraform.tfvars <<'EOF'
          ${{ secrets.TFVARS }}
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          if [ "${{ github.event.inputs.mode }}" = "incident" ]; then
            terraform apply -auto-approve -var-file=terraform.tfvars -var="replicas_red=1"
          else
            terraform apply -auto-approve -var-file=terraform.tfvars
          fi

      - name: Scale red deployment
        if: github.event.inputs.mode == 'incident'
        run: kubectl scale deployment demo-api-red --replicas=1 -n observability
