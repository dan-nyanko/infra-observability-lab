name: Terraform Plan (PR Comment)

on:
  pull_request:
    paths:
      - 'terraform/**'

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write  # Needed to comment on PRs

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_TF_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Set up GCP credentials
        run: |
          echo "${{ secrets.GCP_TF_KEY }}" > $HOME/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -var-file=terraform.tfvars > plan.txt
          echo 'PLAN<<EOF' >> $GITHUB_ENV
          cat plan.txt >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
        working-directory: terraform

      - name: Comment on PR with Plan Output
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          message: |
            ### Terraform Plan Output
            ```
            ${{ env.PLAN }}
            ```