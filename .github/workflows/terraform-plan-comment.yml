name: Terraform Plan (PR Comment)

on:
  pull_request:
    paths:
      - "terraform/**"

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # Needed to comment on PRs

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: terraform-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          audience: https://github.com/

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Write tfvars
        run: |
          cat > terraform.tfvars <<'EOF'
          ${{ secrets.TFVARS }}
          EOF
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -var-file=terraform.tfvars > plan.txt
          echo 'PLAN<<EOF' >> $GITHUB_ENV
          cat plan.txt >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
        working-directory: terraform

      - name: Comment on PR with Plan Output
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          message: |
            ### Terraform Plan Output
            ```
            ${{ env.PLAN }}
            ```
